[project]
name = "paper-proof"
version = "0.1.0"
description = "Checks the facts in a paper before anyone else does: every reference exists and says what the bibliography claims (title, authors, year, venue, not retracted), and the numbers in the text agree with the tables."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "zch6a" }]
keywords = ["references", "bibtex", "citations", "hallucinated-citations", "latex", "arxiv", "research", "peer-review", "academic-writing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
# One small, pure-Python dependency, for PDF text. Everything else is the standard library.
dependencies = ["pypdf>=4.0"]

[project.urls]
Homepage = "https://github.com/zch6a/paper-proof"
Issues = "https://github.com/zch6a/paper-proof/issues"

[project.scripts]
paper-proof = "paper_proof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_proof"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = "--doctest-modules --import-mode=importlib"

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
